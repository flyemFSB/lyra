[package]
name        = "xtask"
description = "构建自动化：依赖审计与上游冒烟"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
publish    = false

[features]
default = []
# smoke 任务需要真实上游，因此把应用层（连同 reqwest / tokio / 凭据存储）挂在可选依赖后面，
# 让 CI 常用的 audit / package 任务不必拖着整棵 HTTP 依赖树。
smoke = ["dep:lyra-app", "dep:tokio", "dep:tracing-subscriber"]

[dependencies]
lyra-app = { workspace = true, optional = true }
anyhow   = { workspace = true }
tokio    = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tracing-subscriber = { workspace = true, optional = true }

[lints]
workspace = true
