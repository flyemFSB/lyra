# cargo-deny 配置见 https://embarkstudios.github.io/cargo-deny/
[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0",
  "Unlicense", "BSL-1.0", "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# 方案 §3.2：只允许 rustls+ring 作为 TLS 后端，禁止 OpenSSL / SChannel 的 C 实现
deny = [
  { name = "native-tls" },
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "schannel" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
