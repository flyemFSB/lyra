[workspace]
# Rust 2024 版虚拟工作区必须显式声明解析器；resolver 3 启用 MSRV 感知的依赖解析
# （incompatible-rust-versions = "fallback"），避免 cargo update 选到需要更高 rustc 的版本
resolver = "3"
members = [
  "crates/proto",
  "crates/api",
  "crates/store",
  "crates/audio",
  "crates/app",
  "crates/ui",
  "crates/desktop",
  "crates/xtask",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.99"
license      = "MIT"
authors      = ["lyra contributors"]
repository   = "https://github.com/flyemFSB/lyra"

[workspace.dependencies]
# 内部 crate（依赖链：proto <- api <- app <- ui <- desktop）
lyra-proto = { path = "crates/proto" }
lyra-api   = { path = "crates/api" }
lyra-store = { path = "crates/store" }
lyra-audio = { path = "crates/audio" }
lyra-app   = { path = "crates/app" }
lyra-ui    = { path = "crates/ui" }

# UI 统一通过 gpui-kit 门面访问 GPUI
gpui-kit       = "0.7.3"

# 密码学与编解码原语
md-5       = "0.10"
sha2       = "0.10"
aes        = "0.8"
cbc        = "0.1"
rsa        = "0.9"
base64     = "0.22"
hex        = "0.4"
flate2     = "1"
rand       = "0.8"
# 密钥材料析构时清零（零化）
zeroize    = "1"

# 音频解码与播放（按需启用 FLAC/MP3/Vorbis/WAV/AAC）
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "vorbis", "ogg", "wav", "aac", "isomp4", "pcm"] }
cpal      = "0.16"
rubato    = "0.15"
ringbuf   = "0.5"

# 通用依赖
serde              = { version = "1", features = ["derive"] }
# 保持键顺序，对齐逆向协议中的 JSON 序列化行为
serde_json         = { version = "1", features = ["preserve_order"] }
moka               = { version = "0.12", features = ["sync"] }
redb               = "2"
dashmap            = "6"
# 签名热路径：参数表就地排序（方案 §5.1）
smallvec           = "1"
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures            = "0.3"
async-trait        = "0.1"
parking_lot        = "0.12"
crossbeam-channel  = "0.5"
async-channel      = "2"
# 显式使用 Windows 原生凭据管理器，保证跨进程持久化
keyring            = { version = "3", features = ["windows-native"] }
url                = "2"
chrono             = { version = "0.4", default-features = false, features = ["std"] }
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "charset"] }

# 测试依赖
tempfile = "3"
hound    = "3"

[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all          = { level = "warn", priority = -1 }
pedantic     = { level = "warn", priority = -1 }
unwrap_used  = "warn"
expect_used  = "warn"
todo         = "deny"
dbg_macro    = "deny"

# 忽略无实际收益的 pedantic 规则，保持代码简洁
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# 协议计算需与逆向 JS/原端行为一致，允许数值有损转换
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# 协议常量保持原样以便与抓包结果核对
unreadable_literal = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"

[profile.release]
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
opt-level     = 3
