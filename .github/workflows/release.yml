name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 依赖缓存
        uses: Swatinem/rust-cache@v2

      - name: 解析版本号
        id: get_version
        shell: pwsh
        run: |
          $manifest = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          } else {
            $version = $manifest
          }
          if ($version -ne $manifest) { throw "tag 版本 $version 与 Cargo.toml 版本 $manifest 不一致" }
          Write-Host "发布版本号: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 编译 Release 二进制
        run: cargo build --release --locked -p lyra

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress
            $isccDir = "C:\Program Files (x86)\Inno Setup 6"
            if (Test-Path $isccDir) {
              $isccDir | Out-File -FilePath $env:GITHUB_PATH -Append
            }
          }

      # 打包逻辑只有一份：与本地 `cargo xtask package` 完全一致
      - name: 构建安装程序与绿色便携包
        run: cargo run -p xtask --locked -- package

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: lyra-windows-x64
          path: target/dist/*
          if-no-files-found: error

      - name: 发布至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/*.exe
            target/dist/*.zip
            target/dist/checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
